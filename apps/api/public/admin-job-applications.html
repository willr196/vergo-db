<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Job Applications | VERGO Events — Event Staffing in London</title>
  <meta name="description" content="Review applications, candidate progress, and staffing pipelines from the VERGO Events admin job applications view.">
  <meta property="og:title" content="Admin Job Applications | VERGO Events — Event Staffing in London">
  <meta property="og:description" content="Review applications, candidate progress, and staffing pipelines from the VERGO Events admin job applications view.">
  <meta property="og:image" content="https://vergoltd.com/logo.png">
  <meta property="og:url" content="https://vergoltd.com/admin-job-applications">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="/favicon.ico">
  <link rel="canonical" href="https://vergoltd.com/admin-job-applications">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/pages/css/admin-shared.css?v=7">
</head>
<body>
  <a href="#as-content" class="as-skip-link">Skip to main content</a>

  <div class="as-main">
    <header class="as-topbar">
      <button id="as-menu-btn" aria-label="Toggle navigation">&#9776;</button>
      <h1 class="as-topbar-title">Job Applications</h1>
    </header>

    <div class="as-content" id="as-content">
      <!-- Stats — click a card to filter -->
      <div class="kpi-grid" id="stats-row">
        <div class="kpi-card" data-filter="all"><div class="kpi-label">Total</div><div class="kpi-value" id="stat-total">-</div></div>
        <div class="kpi-card kpi-warning" data-filter="PENDING"><div class="kpi-label">Pending</div><div class="kpi-value" id="stat-pending">-</div></div>
        <div class="kpi-card kpi-info" data-filter="SELECTED"><div class="kpi-label">Selected</div><div class="kpi-value" id="stat-selected">-</div></div>
        <div class="kpi-card kpi-success" data-filter="CONFIRMED"><div class="kpi-label">Confirmed</div><div class="kpi-value" id="stat-confirmed">-</div></div>
        <div class="kpi-card kpi-error" data-filter="REJECTED"><div class="kpi-label">Rejected</div><div class="kpi-value" id="stat-rejected">-</div></div>
      </div>

      <!-- Filters -->
      <div class="as-filters">
        <div class="as-filter-group">
          <label for="filter-status">Status</label>
          <select id="filter-status">
            <option value="">All statuses</option>
            <option value="PENDING">Pending</option>
            <option value="REVIEWED">Reviewed</option>
            <option value="SELECTED">Selected</option>
            <option value="CONFIRMED">Confirmed</option>
            <option value="REJECTED">Rejected</option>
            <option value="WITHDRAWN">Withdrawn</option>
          </select>
        </div>
        <div class="as-filter-group">
          <label for="filter-job">Job</label>
          <select id="filter-job">
            <option value="">All jobs</option>
          </select>
        </div>
        <div class="as-filter-group">
          <label for="filter-search">Search</label>
          <input type="search" id="filter-search" placeholder="Name, email, phone, job…">
        </div>
      </div>

      <!-- Table -->
      <div class="as-table-wrap">
        <div class="as-table-toolbar">
          <div class="as-toolbar-left">
            <span id="app-count" class="text-muted fs-sm">Loading…</span>
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th>Applicant</th>
              <th>Job</th>
              <th>Status</th>
              <th>Applied</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="applications-body">
            <tr><td colspan="5" class="loading"><div class="as-skeleton" style="margin:auto;max-width:200px"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detail-modal" class="modal-backdrop d-none">
    <div class="modal">
      <div class="modal-header">
        <h2>Application</h2>
        <button class="modal-close" type="button" data-action="close-detail" aria-label="Close">&#x2715;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer">
        <button class="btn btn-ghost" data-action="close-detail">Close</button>
      </div>
    </div>
  </div>

  <!-- Reject Modal -->
  <div id="reject-modal" class="modal-backdrop d-none">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>Reject application</h2>
        <button class="modal-close" type="button" data-action="close-reject" aria-label="Close">&#x2715;</button>
      </div>
      <div class="modal-body">
        <p class="detail-value mb-2" id="reject-subject"></p>
        <label class="as-check">
          <input type="checkbox" id="reject-notify">
          <span>Email the applicant to tell them they were not selected</span>
        </label>
        <p class="text-muted fs-sm mt-1">
          Left unticked, the application simply moves to Rejected — nothing is sent and
          the applicant is not told.
        </p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" type="button" data-action="close-reject">Cancel</button>
        <button class="btn btn-danger" type="button" data-action="confirm-reject">Reject</button>
      </div>
    </div>
  </div>

  <script src="/js/admin-core.js"></script>
  <script src="/js/admin-nav.js"></script>
  <script src="/pages/js/admin-job-applications.js"></script>
</body>
</html>
