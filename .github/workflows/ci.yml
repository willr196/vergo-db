name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: node --test dist/src/__tests__/*.test.js

      # Informational only — apps/api's dependency tree has known moderate
      # advisories not yet worth a breaking major-version bump. Doesn't fail
      # the build, but keeps the count visible in every run's log.
      - name: Dependency audit (non-blocking)
        run: npm audit --audit-level=critical || true

  mobile:
    name: Mobile — typecheck, lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test -- --ci

      - name: Dependency audit (non-blocking)
        run: npm audit --audit-level=critical || true
