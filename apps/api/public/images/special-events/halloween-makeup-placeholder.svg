<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 720" width="1680" height="720" role="presentation" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mk-room" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1d1509"/>
      <stop offset="55%" stop-color="#110c08"/>
      <stop offset="100%" stop-color="#09080a"/>
    </linearGradient>
    <radialGradient id="mk-bulb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff3d6" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#f6c357" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ed7a33" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mk-station" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#f6c357" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ed7a33" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mk-counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1d0e"/>
      <stop offset="100%" stop-color="#0c0907"/>
    </linearGradient>
    <linearGradient id="mk-vig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#09080a" stop-opacity="0.85"/>
      <stop offset="18%" stop-color="#09080a" stop-opacity="0.1"/>
      <stop offset="82%" stop-color="#09080a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#09080a" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="mk-vig2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09080a" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#09080a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#09080a" stop-opacity="0.72"/>
    </linearGradient>
  </defs>

  <rect width="1680" height="720" fill="url(#mk-room)"/>

  <g transform="translate(0, 62)">

  <!-- A dressing room that runs the whole frame: three lit stations along one
       counter, rather than a single mirror adrift in the middle of a 21:9 crop. -->
  <g>
    <ellipse cx="300" cy="330" rx="290" ry="260" fill="url(#mk-station)"/>
    <ellipse cx="840" cy="310" rx="310" ry="280" fill="url(#mk-station)"/>
    <ellipse cx="1380" cy="330" rx="290" ry="260" fill="url(#mk-station)"/>
  </g>

  <!-- Mirrors -->
  <g fill="#0d0a08" fill-opacity="0.82" stroke="#d4af37" stroke-opacity="0.26" stroke-width="2.5">
    <rect x="168" y="118" width="264" height="330" rx="8"/>
    <rect x="690" y="86" width="300" height="372" rx="8"/>
    <rect x="1248" y="118" width="264" height="330" rx="8"/>
  </g>

  <!-- Bulbs around each mirror -->
  <g>
    <circle cx="168" cy="160" r="20" fill="url(#mk-bulb)"/><circle cx="168" cy="248" r="20" fill="url(#mk-bulb)"/>
    <circle cx="168" cy="336" r="20" fill="url(#mk-bulb)"/><circle cx="168" cy="420" r="20" fill="url(#mk-bulb)"/>
    <circle cx="432" cy="160" r="20" fill="url(#mk-bulb)"/><circle cx="432" cy="248" r="20" fill="url(#mk-bulb)"/>
    <circle cx="432" cy="336" r="20" fill="url(#mk-bulb)"/><circle cx="432" cy="420" r="20" fill="url(#mk-bulb)"/>
    <circle cx="232" cy="118" r="18" fill="url(#mk-bulb)"/><circle cx="300" cy="118" r="18" fill="url(#mk-bulb)"/>
    <circle cx="368" cy="118" r="18" fill="url(#mk-bulb)"/>

    <circle cx="690" cy="130" r="22" fill="url(#mk-bulb)"/><circle cx="690" cy="222" r="22" fill="url(#mk-bulb)"/>
    <circle cx="690" cy="314" r="22" fill="url(#mk-bulb)"/><circle cx="690" cy="406" r="22" fill="url(#mk-bulb)"/>
    <circle cx="990" cy="130" r="22" fill="url(#mk-bulb)"/><circle cx="990" cy="222" r="22" fill="url(#mk-bulb)"/>
    <circle cx="990" cy="314" r="22" fill="url(#mk-bulb)"/><circle cx="990" cy="406" r="22" fill="url(#mk-bulb)"/>
    <circle cx="762" cy="86" r="20" fill="url(#mk-bulb)"/><circle cx="840" cy="86" r="20" fill="url(#mk-bulb)"/>
    <circle cx="918" cy="86" r="20" fill="url(#mk-bulb)"/>

    <circle cx="1248" cy="160" r="20" fill="url(#mk-bulb)"/><circle cx="1248" cy="248" r="20" fill="url(#mk-bulb)"/>
    <circle cx="1248" cy="336" r="20" fill="url(#mk-bulb)"/><circle cx="1248" cy="420" r="20" fill="url(#mk-bulb)"/>
    <circle cx="1512" cy="160" r="20" fill="url(#mk-bulb)"/><circle cx="1512" cy="248" r="20" fill="url(#mk-bulb)"/>
    <circle cx="1512" cy="336" r="20" fill="url(#mk-bulb)"/><circle cx="1512" cy="420" r="20" fill="url(#mk-bulb)"/>
    <circle cx="1312" cy="118" r="18" fill="url(#mk-bulb)"/><circle cx="1380" cy="118" r="18" fill="url(#mk-bulb)"/>
    <circle cx="1448" cy="118" r="18" fill="url(#mk-bulb)"/>
  </g>

  <!-- Seated figures, and an artist standing over the middle one. -->
  <g fill="#07060a" fill-opacity="0.88">
    <ellipse cx="300" cy="300" rx="60" ry="72"/>
    <path d="M198 500 Q214 384 300 384 Q386 384 402 500 Z"/>

    <ellipse cx="820" cy="272" rx="66" ry="80"/>
    <path d="M706 500 Q724 368 820 368 Q916 368 934 500 Z"/>

    <ellipse cx="1380" cy="300" rx="60" ry="72"/>
    <path d="M1278 500 Q1294 384 1380 384 Q1466 384 1482 500 Z"/>
  </g>
  <g fill="#050409" fill-opacity="0.92">
    <ellipse cx="952" cy="232" rx="44" ry="54"/>
    <path d="M886 500 Q898 348 952 348 Q1006 348 1018 500 Z"/>
    <path d="M912 372 L858 300" stroke="#050409" stroke-width="20" stroke-linecap="round"/>
  </g>
  <circle cx="852" cy="294" r="13" fill="#f6c357" fill-opacity="0.55"/>

  </g>

  <!-- Counter in the foreground, filling the bottom of the frame: you are
       looking across it, so it runs to the bottom edge rather than leaving a
       dead band under the stations. -->
  <rect x="0" y="556" width="1680" height="164" fill="url(#mk-counter)"/>
  <path d="M0 556 L1680 556" stroke="#d4af37" stroke-opacity="0.34" stroke-width="2"/>
  <g fill="#0f0b08" stroke="#d4af37" stroke-opacity="0.28" stroke-width="2">
    <rect x="472" y="518" width="16" height="38" rx="4"/>
    <rect x="500" y="508" width="16" height="48" rx="4"/>
    <rect x="528" y="526" width="16" height="30" rx="4"/>
    <rect x="1112" y="514" width="16" height="42" rx="4"/>
    <rect x="1140" y="524" width="16" height="32" rx="4"/>
    <rect x="1168" y="506" width="16" height="50" rx="4"/>
  </g>

  <rect width="1680" height="720" fill="url(#mk-vig2)"/>
  <rect width="1680" height="720" fill="url(#mk-vig)"/>
</svg>
