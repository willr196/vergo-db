<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client Login | VERGO Events — Event Staffing in London</title>
  <meta name="description" content="Sign in to your VERGO Events client account to manage event staffing requests, bookings, and account activity in London.">
  <meta property="og:title" content="Client Login | VERGO Events — Event Staffing in London">
  <meta property="og:description" content="Sign in to your VERGO Events client account to manage event staffing requests, bookings, and account activity in London.">
  <meta property="og:image" content="https://vergoltd.com/logo.png">
  <meta property="og:url" content="https://vergoltd.com/client-login">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="/favicon.ico">
  <link rel="canonical" href="https://vergoltd.com/client-login">
<meta name="robots" content="noindex, nofollow">
<!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vergo-a11y.css">
  <link rel="stylesheet" href="/vergo-public-pages.css">
  <link rel="stylesheet" href="/pages/css/public-auth.css">
</head>
<body class="public-auth-page client-auth-page">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="site-header" class="site-header" role="banner"></div>
  
  <main id="main-content" class="auth-main">
    <div class="auth-container auth-container-narrow">
      <div class="auth-box">
        <h1>Client Login</h1>
        <p class="subtitle">Access your client dashboard</p>
        
        <div class="toggle-type">
          <span>Looking for work?</span>
          <a href="/user-login">Job Seeker Login</a>
        </div>
        
        <div id="message"></div>
        
        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email">
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <div class="pw-wrap">
              <input type="password" id="password" name="password" required autocomplete="current-password">
              <button type="button" class="pw-toggle" aria-label="Show password">
                <svg class="pw-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="pw-eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
          
          <a href="/forgot-password?type=client" class="forgot-link">Forgot password?</a>
          
          <button type="submit" class="btn">Log In</button>
        </form>
        
        <div id="resend-section" class="resend-section d-none">
          <p>Didn't receive verification email?</p>
          <button class="btn-link" type="button" id="resend-verification-btn">Resend verification email</button>
        </div>
        
        <div class="auth-footer">
          Don't have an account? <a href="/client-register">Register as a Client</a>
        </div>
      </div>
      
      <a href="/hire-staff" class="back-link">← Back to Hire Event Staff</a>
    </div>
  </main>
  
  <footer role="contentinfo"></footer>
  

  <script src="/pages/js/client-login.js"></script>
  <script src="/vergo-public-shell.js?v=2"></script>
</body>
</html>
