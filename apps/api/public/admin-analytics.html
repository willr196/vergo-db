<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Analytics | VERGO Events — Event Staffing in London</title>
  <meta name="description" content="Monitor VERGO Events reporting, staffing demand, and platform performance from the internal analytics dashboard.">
  <meta property="og:title" content="Admin Analytics | VERGO Events — Event Staffing in London">
  <meta property="og:description" content="Monitor VERGO Events reporting, staffing demand, and platform performance from the internal analytics dashboard.">
  <meta property="og:image" content="https://vergoltd.com/logo.png">
  <meta property="og:url" content="https://vergoltd.com/admin-analytics">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="/favicon.ico">
  <link rel="canonical" href="https://vergoltd.com/admin-analytics">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/pages/css/admin-shared.css?v=7">
  <link rel="stylesheet" href="/pages/css/admin-analytics.css">
</head>
<body>
  <a href="#as-content" class="as-skip-link">Skip to main content</a>

  <div class="as-main">
    <header class="as-topbar">
      <button id="as-menu-btn" aria-label="Toggle navigation">&#9776;</button>
      <h1 class="as-topbar-title">Analytics</h1>
      <div class="as-topbar-right">
        <button class="btn btn-ghost btn-sm" data-action="refresh">&#8635; Refresh</button>
        <button class="btn btn-ghost btn-sm" data-action="export-csv">↓ CSV</button>
      </div>
    </header>

    <div class="as-content" id="as-content">
      <!-- Weekly summary -->
      <div class="as-section-hdr mb-2"><span class="as-section-title">This week vs last week</span></div>
      <div class="weekly-grid" id="weekly-grid">
        <div class="weekly-card"><div class="weekly-label">Applications</div><div class="weekly-val" id="wk-apps">-</div><div class="weekly-delta" id="wk-apps-delta"></div></div>
      </div>

      <!-- Charts grid -->
      <div class="col-2">
        <div class="chart-card">
          <div class="chart-title">Applicant funnel</div>
          <canvas id="chart-funnel"></canvas>
        </div>

        <div class="chart-card">
          <div class="chart-title">Top roles applied for</div>
          <canvas id="chart-roles"></canvas>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="/js/admin-core.js"></script>
  <script src="/js/admin-nav.js"></script>
  <script src="/pages/js/admin-analytics.js"></script>
</body>
</html>
