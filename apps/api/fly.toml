app = "vergo-app"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

[env]
  # The release command below migrates this app's own database, which is
  # remote by definition. scripts/guard-db-target.js refuses a remote target
  # unless this is set, so that a migration run from a developer's laptop
  # cannot reach production by accident. See docs/database-environments.md.
  ALLOW_REMOTE_DB = "1"

  # Wait for an existing Prisma migration session to release its advisory lock.
  PRISMA_DEPLOY_LOCK_WAIT_TIMEOUT_MS = "180000"
  PRISMA_DEPLOY_LOCK_POLL_INTERVAL_MS = "2000"

[deploy]
  release_command = "npm run prisma:deploy"

  # Never let a crash-on-boot image destroy the machine that is still serving.
  # The default rolling strategy updates each machine in turn, so on 2026-09-15 it
  # took down the last healthy one before the replacement ever passed /health.
  # bluegreen builds the new machines alongside and aborts if they fail their check.
  strategy = "bluegreen"

# Serve static assets from Fly's edge CDN (bypasses Node)
[[statics]]
  guest_path = "/app/public"
  url_prefix = "/images"

[[statics]]
  guest_path = "/app/public"
  url_prefix = "/vergo-"

[[http_service.checks]]
  interval = "10s"
  grace_period = "10s"
  method = "get"
  path = "/health"
  timeout = "2s"
