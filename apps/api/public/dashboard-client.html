<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client Dashboard | VERGO Events — Event Staffing in London</title>
  <meta name="description" content="Review active briefs, confirmed events, and booking history from the VERGO Events client dashboard.">
  <meta property="og:title" content="Client Dashboard | VERGO Events — Event Staffing in London">
  <meta property="og:description" content="Review active briefs, confirmed events, and booking history from the VERGO Events client dashboard.">
  <meta property="og:image" content="https://vergoltd.com/logo.png">
  <meta property="og:url" content="https://vergoltd.com/dashboard-client">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico">
  <link rel="canonical" href="https://vergoltd.com/dashboard-client">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vergo-styles.css">
  <link rel="stylesheet" href="/vergo-a11y.css">
  <link rel="stylesheet" href="/pages/css/dashboard-shared.css">
  <link rel="stylesheet" href="/vergo-public-pages.css">
</head>
<body class="dashboard-page dashboard-shell-page">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="site-header" class="site-header" role="banner"></div>

  <!-- User context bar -->
  <div class="dash-header" role="region" aria-label="Account">
    <div class="dash-header-inner">
      <div class="dash-user-area">
        <span class="dash-user-name" id="header-company"></span>
        <span class="tier-badge" id="header-tier" aria-label="Account type"></span>
        <button class="btn-logout" id="logout-btn" type="button">Sign out</button>
      </div>
    </div>
  </div>

  <main id="main-content" class="dash-main">

    <!-- Loading -->
    <div class="dash-loading" id="loading-state" aria-busy="true" aria-label="Loading your dashboard">
      <div class="loading-ring" role="progressbar"></div>
      <p>Loading your dashboard…</p>
    </div>

    <!-- Error -->
    <div class="dash-alert dash-alert-error" id="error-state" hidden>
      <strong>Unable to load dashboard.</strong> <span id="error-msg"></span>
    </div>

    <!-- Dashboard content -->
    <div id="dashboard-content" hidden>

      <!-- 1. Active briefs -->
      <section class="dash-section" aria-labelledby="briefs-heading">
        <div class="dash-section-header">
          <div>
            <h2 class="dash-section-title" id="briefs-heading">Active Briefs</h2>
            <span class="dash-section-count" id="briefs-count"></span>
          </div>
          <button class="btn-apply" id="new-brief-btn" type="button">New Brief</button>
        </div>
        <div class="card-grid" id="briefs-grid" aria-live="polite"></div>
      </section>

      <!-- 2. Upcoming confirmed events -->
      <section class="dash-section" aria-labelledby="events-heading">
        <div class="dash-section-header">
          <h2 class="dash-section-title" id="events-heading">Upcoming Events</h2>
          <span class="dash-section-count" id="events-count"></span>
        </div>
        <div class="card-grid" id="events-grid" aria-live="polite"></div>
      </section>

      <!-- 3. Brief history -->
      <section class="dash-section" aria-labelledby="history-heading">
        <div class="dash-section-header">
          <h2 class="dash-section-title" id="history-heading">Brief History</h2>
          <span class="dash-section-count" id="history-count"></span>
        </div>
        <div class="card-grid" id="history-grid" aria-live="polite"></div>
      </section>

    </div>
  </main>

  <div class="dash-modal-backdrop" id="brief-modal" hidden>
    <div class="dash-modal" role="dialog" aria-modal="true" aria-labelledby="brief-modal-title">
      <div class="dash-modal-header">
        <h2 id="brief-modal-title">New Staffing Brief</h2>
        <button class="dash-modal-close" type="button" data-action="close-brief-modal" aria-label="Close">×</button>
      </div>
      <form id="brief-form" class="dash-form">
        <div class="dash-form-grid">
          <label>
            <span>Occasion type</span>
            <select name="eventType" required>
              <option value="">Select</option>
              <option value="Corporate Event">Corporate Event</option>
              <option value="Private Party">Private Party</option>
              <option value="Wedding">Wedding</option>
              <option value="Festival/Concert">Festival/Concert</option>
              <option value="Sports Event">Sports Event</option>
              <option value="Film/TV Production">Film/TV Production</option>
              <option value="Other">Other</option>
            </select>
          </label>
          <label>
            <span>Staff needed</span>
            <input type="number" name="staffCount" min="1" max="500" required>
          </label>
          <label>
            <span>Event date</span>
            <input type="date" name="eventDate">
          </label>
          <label>
            <span>End date</span>
            <input type="date" name="eventEndDate">
          </label>
          <label class="dash-form-full">
            <span>Location</span>
            <input type="text" name="location" maxlength="200" required>
          </label>
          <label class="dash-form-full">
            <span>Roles required</span>
            <input type="text" name="roles" maxlength="500" required placeholder="Bartenders, waiters, hosts">
          </label>
          <label>
            <span>Shift start</span>
            <input type="time" name="shiftStart">
          </label>
          <label>
            <span>Shift end</span>
            <input type="time" name="shiftEnd">
          </label>
          <label>
            <span>Service lane</span>
            <select name="requestedLane">
              <option value="">No preference</option>
              <option value="FLEX">Flex</option>
              <option value="SELECT">Select</option>
              <option value="MANAGED">Managed</option>
            </select>
          </label>
          <label>
            <span>Budget</span>
            <input type="text" name="budget" maxlength="100">
          </label>
          <label class="dash-form-full">
            <span>Details</span>
            <textarea name="description" maxlength="2000" rows="4"></textarea>
          </label>
        </div>
        <div class="dash-form-error" id="brief-form-error" role="alert" hidden></div>
        <div class="dash-modal-footer">
          <button class="btn-logout" type="button" data-action="close-brief-modal">Cancel</button>
          <button class="btn-apply" type="submit">Submit Brief</button>
        </div>
      </form>
    </div>
  </div>

  <footer role="contentinfo"></footer>
  <script src="/auth.js"></script>
  <script src="/pages/js/dashboard-client.js"></script>
  <script src="/vergo-public-shell.js"></script>
</body>
</html>
