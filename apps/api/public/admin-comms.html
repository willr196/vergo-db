<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Communications | VERGO Events — Event Staffing in London</title>
  <meta name="description" content="Coordinate outbound communications, updates, and internal messaging for VERGO Events staffing activity.">
  <meta property="og:title" content="Admin Communications | VERGO Events — Event Staffing in London">
  <meta property="og:description" content="Coordinate outbound communications, updates, and internal messaging for VERGO Events staffing activity.">
  <meta property="og:image" content="https://vergoltd.com/logo.png">
  <meta property="og:url" content="https://vergoltd.com/admin-comms">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="/favicon.ico">
  <link rel="canonical" href="https://vergoltd.com/admin-comms">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/pages/css/admin-shared.css?v=7">
</head>
<body>
  <a href="#as-content" class="as-skip-link">Skip to main content</a>

  <div class="as-main">
    <header class="as-topbar">
      <button id="as-menu-btn" aria-label="Toggle navigation">&#9776;</button>
      <h1 class="as-topbar-title">Messages</h1>
    </header>

    <div class="as-content" id="as-content">
      <div class="as-tabs" id="comms-tabs">
        <button class="as-tab active" data-tab="push">Push notification</button>
        <button class="as-tab" data-tab="email">Email broadcast</button>
      </div>

      <!-- ── Push Notifications ─────────────────────── -->
      <div id="push-tab" class="tab-content active">
        <div style="max-width:560px">
          <div class="mb-2">
            <p class="text-muted fs-sm mb-2">Send a push notification to registered mobile devices.</p>
          </div>
          <div class="mb-2">
            <label class="as-label" for="push-audience">Audience</label>
            <select id="push-audience" class="as-input">
              <option value="all">All users (staff + clients)</option>
              <option value="staff">Staff only</option>
              <option value="clients">Clients only</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="as-label" for="push-title">Notification Title</label>
            <input type="text" id="push-title" class="as-input" placeholder="e.g. New job available!" maxlength="100">
          </div>
          <div class="mb-2">
            <label class="as-label" for="push-body">Message</label>
            <textarea id="push-body" placeholder="Notification body text…" maxlength="500"></textarea>
          </div>
          <div id="push-result" class="mb-2"></div>
          <button class="btn btn-primary" data-action="send-push">Send Push Notification</button>
        </div>
      </div>

      <!-- ── Email Broadcast ────────────────────────── -->
      <div id="email-tab" class="tab-content">
        <div style="max-width:620px">
          <div class="mb-2">
            <p class="text-muted fs-sm mb-2">Send a broadcast email via Resend to a selected audience.</p>
          </div>
          <div class="mb-2">
            <label class="as-label" for="email-audience">Audience</label>
            <select id="email-audience" class="as-input">
              <option value="all_clients">All approved clients</option>
              <option value="all_staff">All staff applicants</option>
              <option value="pending_staff">Pending staff (RECEIVED)</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="as-label" for="email-subject">Subject</label>
            <input type="text" id="email-subject" class="as-input" placeholder="Email subject line" maxlength="200">
          </div>
          <div class="mb-2">
            <label class="as-label" for="email-body">Body (plain text, line breaks become &lt;br&gt;)</label>
            <textarea id="email-body" style="min-height:200px" placeholder="Email body…" maxlength="10000"></textarea>
          </div>
          <div id="email-result" class="mb-2"></div>
          <button class="btn btn-primary" data-action="send-email">Send Email Broadcast</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Contact detail modal -->
  <script src="/js/admin-core.js"></script>
  <script src="/js/admin-nav.js"></script>
  <script src="/pages/js/admin-comms.js"></script>
</body>
</html>
