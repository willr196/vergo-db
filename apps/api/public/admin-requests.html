<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Requests | VERGO Admin</title>
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="/favicon.ico">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/pages/css/admin-shared.css?v=7">
</head>
<body>
  <a href="#as-content" class="as-skip-link">Skip to main content</a>

  <div class="as-main">
    <header class="as-topbar">
      <button id="as-menu-btn" aria-label="Toggle navigation">&#9776;</button>
      <h1 class="as-topbar-title">Staff requests</h1>
    </header>

    <div class="as-content" id="as-content">
      <!-- Everything sent from the website's hire and quote forms. Click a card to filter. -->
      <div class="kpi-grid" id="stats-row">
        <div class="kpi-card" data-filter="all"><div class="kpi-label">Total</div><div class="kpi-value" id="stat-total">-</div></div>
        <div class="kpi-card kpi-info" data-filter="NEW"><div class="kpi-label">New</div><div class="kpi-value" id="stat-new">-</div><div class="kpi-sub">Not yet answered</div></div>
        <div class="kpi-card kpi-warning" data-filter="CONTACTED"><div class="kpi-label">Contacted</div><div class="kpi-value" id="stat-contacted">-</div></div>
        <div class="kpi-card kpi-success" data-filter="QUOTED"><div class="kpi-label">Quoted</div><div class="kpi-value" id="stat-quoted">-</div></div>
        <div class="kpi-card kpi-success" data-filter="BOOKED"><div class="kpi-label">Booked</div><div class="kpi-value" id="stat-booked">-</div></div>
        <div class="kpi-card kpi-error" data-filter="LOST"><div class="kpi-label">Lost</div><div class="kpi-value" id="stat-lost">-</div></div>
      </div>

      <div class="as-filters">
        <div class="as-filter-group">
          <label for="filter-type">Type</label>
          <select id="filter-type">
            <option value="">Everything</option>
            <option value="STAFF_REQUEST">Booking requests</option>
            <option value="GENERAL">Questions</option>
          </select>
        </div>
        <div class="as-filter-group">
          <label for="filter-status">Status</label>
          <select id="filter-status">
            <option value="">All statuses</option>
            <option value="NEW">New</option>
            <option value="CONTACTED">Contacted</option>
            <option value="QUOTED">Quoted</option>
            <option value="BOOKED">Booked</option>
            <option value="LOST">Lost</option>
          </select>
        </div>
        <div class="as-filter-group">
          <label for="filter-search">Search</label>
          <input type="search" id="filter-search" placeholder="Name, email, company, event…">
        </div>
      </div>

      <div class="as-table-wrap">
        <div class="as-table-toolbar">
          <div class="as-toolbar-left">
            <span id="request-count" class="text-muted fs-sm">Loading…</span>
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th>From</th>
              <th>Request</th>
              <th>Event date</th>
              <th>Status</th>
              <th>Received</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="requests-body">
            <tr><td colspan="6" class="loading"><div class="as-skeleton" style="margin:auto;max-width:200px"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="detail-modal" class="modal-backdrop d-none">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h2 id="modal-title">Request</h2>
        <button class="modal-close" type="button" data-action="close-detail" aria-label="Close">&#x2715;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer">
        <button class="btn btn-ghost" type="button" data-action="close-detail">Close</button>
      </div>
    </div>
  </div>

  <script src="/js/admin-core.js"></script>
  <script src="/js/admin-nav.js"></script>
  <script src="/pages/js/admin-requests.js"></script>
</body>
</html>
