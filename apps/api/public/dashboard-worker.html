<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worker Dashboard | VERGO Events — Event Staffing in London</title>
  <meta name="description" content="Track applications, confirmed shifts, and progression from the VERGO Events worker dashboard.">
  <meta property="og:title" content="Worker Dashboard | VERGO Events — Event Staffing in London">
  <meta property="og:description" content="Track applications, confirmed shifts, and progression from the VERGO Events worker dashboard.">
  <meta property="og:image" content="https://vergoltd.com/logo.png">
  <meta property="og:url" content="https://vergoltd.com/dashboard-worker">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico">
  <link rel="canonical" href="https://vergoltd.com/dashboard-worker">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vergo-styles.css?v=2">
  <link rel="stylesheet" href="/vergo-a11y.css">
  <link rel="stylesheet" href="/pages/css/dashboard-shared.css?v=7">
  <link rel="stylesheet" href="/vergo-public-pages.css">
</head>
<body class="dashboard-page dashboard-shell-page">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="site-header" class="site-header" role="banner"></div>

  <!-- User context bar -->
  <div class="dash-header" role="region" aria-label="Account">
    <div class="dash-header-inner">
      <div class="dash-user-area">
        <span class="dash-user-name" id="header-name"></span>
        <span class="tier-badge" id="header-tier" aria-label="Your tier"></span>
        <div class="dash-account-menu">
          <button class="btn-dash-link dash-profile-trigger" id="dash-profile-trigger" type="button" aria-expanded="false" aria-haspopup="true" aria-controls="dash-profile-menu">
            <span>Profile</span>
            <span class="dash-profile-chevron" aria-hidden="true"></span>
          </button>
          <div class="dash-profile-menu" id="dash-profile-menu" role="menu" hidden>
            <a href="/dashboard-worker" role="menuitem">Dashboard</a>
            <a href="/profile" role="menuitem">Edit Profile</a>
            <button class="dash-profile-menu-button is-danger" id="logout-btn" type="button" role="menuitem">Sign out</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <main id="main-content" class="dash-main">

    <!-- Loading -->
    <div class="dash-loading" id="loading-state" aria-busy="true" aria-label="Loading your dashboard">
      <div class="loading-ring" role="progressbar"></div>
      <p>Loading your dashboard…</p>
    </div>

    <!-- Error -->
    <div class="dash-alert dash-alert-error" id="error-state" hidden>
      <strong>Unable to load dashboard.</strong> <span id="error-msg"></span>
    </div>

    <!-- Dashboard content (hidden until loaded) -->
    <div id="dashboard-content" hidden>

      <!-- Profile completeness nudge -->
      <div class="profile-nudge" id="profile-nudge" hidden>
        <div class="profile-nudge-inner">
          <div>
            <strong>Complete your profile</strong>
            <p>Add your bio, photo and availability so VERGO can match you to the right shifts.</p>
          </div>
          <div class="profile-nudge-actions">
            <a href="/onboarding" class="btn-apply btn-gold">Set up profile</a>
            <button type="button" id="nudge-dismiss" class="btn-text-link">Dismiss</button>
          </div>
        </div>
      </div>

      <!-- 1. Available jobs -->
      <section class="dash-section" aria-labelledby="jobs-heading">
        <div class="dash-section-header">
          <h2 class="dash-section-title" id="jobs-heading">Available Jobs</h2>
          <span class="dash-section-count" id="jobs-count"></span>
        </div>
        <div class="card-grid" id="jobs-grid" aria-live="polite"></div>
      </section>

      <!-- 2. My applications -->
      <section class="dash-section" aria-labelledby="apps-heading">
        <div class="dash-section-header">
          <h2 class="dash-section-title" id="apps-heading">My Applications</h2>
          <span class="dash-section-count" id="apps-count"></span>
        </div>
        <div id="confirmed-shifts" hidden>
          <h3 class="dash-subhead is-success">Upcoming Confirmed Shifts</h3>
          <div class="card-grid" id="confirmed-grid"></div>
        </div>
        <div class="card-grid" id="apps-grid" aria-live="polite"></div>
      </section>

      <!-- 3. Progression -->
      <section class="dash-section" aria-labelledby="progress-heading">
        <div class="dash-section-header">
          <h2 class="dash-section-title" id="progress-heading">Your Progression</h2>
        </div>
        <div class="stat-row" id="progress-stats"></div>
        <div id="progress-pathway"></div>
      </section>

    </div>
  </main>

  <footer role="contentinfo"></footer>
  <script src="/auth.js?v=2"></script>
  <script src="/vergo-utils.js"></script>
  <script src="/pages/js/dashboard-worker.js?v=6"></script>
  <script src="/vergo-public-shell.js?v=2"></script>
</body>
</html>
