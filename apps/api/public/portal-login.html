<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | VERGO — Event Staffing London</title>
  <meta name="description" content="Sign in to your VERGO account — for event staff and client companies.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vergo-a11y.css">
  <link rel="stylesheet" href="/vergo-public-pages.css">
  <link rel="stylesheet" href="/pages/css/public-auth.css">
</head>
<body class="public-auth-page">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="site-header" class="site-header" role="banner"></div>

  <main id="main-content" class="auth-main">
    <div class="auth-container auth-container-narrow">
      <div class="auth-box">
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to your VERGO account</p>

        <div id="message" role="alert" aria-live="polite"></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="email">Email address <span class="required" aria-hidden="true">*</span></label>
            <input
              type="email"
              id="email"
              name="email"
              required
              autocomplete="email"
              inputmode="email"
              placeholder="you@example.com"
              aria-required="true"
            >
          </div>

          <div class="form-group">
            <label for="password">Password <span class="required" aria-hidden="true">*</span></label>
            <div class="pw-wrap">
              <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
                placeholder="Your password"
                aria-required="true"
              >
              <button type="button" class="pw-toggle" aria-label="Show password">
                <svg class="pw-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="pw-eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>

          <a href="/forgot-password" class="forgot-link">Forgot password?</a>

          <button type="submit" class="btn" id="submit-btn" aria-busy="false">
            <span class="spinner" aria-hidden="true"></span>
            <span id="btn-label">Sign In</span>
          </button>
        </form>

        <!-- Set password panel — shown when mustChangePassword is true -->
        <form id="set-password-form" novalidate hidden>
          <p class="subtitle" style="margin-bottom: 20px;">You're in. Now set a permanent password to continue.</p>
          <div class="form-group">
            <label for="new-password">New password <span class="required" aria-hidden="true">*</span></label>
            <div class="pw-wrap">
              <input
                type="password"
                id="new-password"
                name="new-password"
                required
                autocomplete="new-password"
                placeholder="At least 8 characters"
                aria-required="true"
              >
              <button type="button" class="pw-toggle" aria-label="Show password">
                <svg class="pw-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="pw-eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm new password <span class="required" aria-hidden="true">*</span></label>
            <div class="pw-wrap">
              <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                required
                autocomplete="new-password"
                placeholder="Repeat your new password"
                aria-required="true"
              >
              <button type="button" class="pw-toggle" aria-label="Show password">
                <svg class="pw-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="pw-eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn" id="set-password-btn" aria-busy="false">
            <span class="spinner" aria-hidden="true"></span>
            <span id="set-password-btn-label">Set Password &amp; Sign In</span>
          </button>
        </form>

        <div class="auth-footer">
          No account yet?&nbsp;
          <a href="/apply">Join as event staff</a>&nbsp;&nbsp;·&nbsp;&nbsp;<a href="/client-register">Register as a client</a>
        </div>
      </div>

      <a href="/" class="back-link">← Back to home</a>
    </div>
  </main>

  <footer role="contentinfo"></footer>

  <script src="/auth.js"></script>
  <script src="/pages/js/portal-login.js"></script>
  <script src="/vergo-public-shell.js"></script>
</body>
</html>
