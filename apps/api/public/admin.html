<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pipeline | VERGO Events — Event Staffing in London</title>
  <meta name="description" content="Review and progress candidate applications to join the VERGO Events staffing roster.">
  <meta property="og:title" content="Pipeline | VERGO Events — Event Staffing in London">
  <meta property="og:description" content="Review and progress candidate applications to join the VERGO Events staffing roster.">
  <meta property="og:image" content="https://vergoltd.com/logo.png">
  <meta property="og:url" content="https://vergoltd.com/admin">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="/favicon.ico">
  <link rel="canonical" href="https://vergoltd.com/admin">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/pages/css/admin-shared.css?v=7">
</head>
<body>

  <div class="as-main">
    <header class="as-topbar">
      <button id="as-menu-btn" aria-label="Toggle navigation">&#9776;</button>
      <span class="as-topbar-title">Pipeline</span>
      <div class="as-topbar-right">
        <button class="btn btn-ghost btn-sm d-none" id="attention-btn" data-action="toggle-attention" aria-expanded="false">
          &#9888; Needs attention <span class="as-count" id="attention-count">0</span>
        </button>
        <span id="as-refresh-label" class="text-muted fs-sm"></span>
        <button class="btn btn-ghost btn-sm" data-action="refresh-stats" aria-label="Refresh">&#8635;</button>
      </div>
    </header>

    <div class="as-content">
      <!-- Everything waiting on a decision, folded away until it needs one.
           Opened from the topbar button. -->
      <section class="as-attention d-none" id="attention-panel">
        <div class="as-attention-head">
          <span>Needs attention</span>
          <button class="btn btn-ghost btn-sm" data-action="toggle-attention">Hide</button>
        </div>
        <div id="attention-body"></div>
      </section>

      <div id="applications-panel">
        <!-- Every card is a filter -->
        <div class="kpi-grid" id="app-stats">
          <div class="kpi-card" data-filter="all">
            <div class="kpi-label">In pipeline</div>
            <div class="kpi-value" id="stat-total">0</div>
            <div class="kpi-sub" id="kpi-week-sub">&nbsp;</div>
          </div>
          <div class="kpi-card kpi-info" data-filter="RECEIVED">
            <div class="kpi-label">New</div>
            <div class="kpi-value" id="stat-received">0</div>
          </div>
          <div class="kpi-card kpi-warning" data-filter="REVIEWING">
            <div class="kpi-label">Reviewing</div>
            <div class="kpi-value" id="stat-reviewing">0</div>
          </div>
          <div class="kpi-card kpi-success" data-filter="SELECTED">
            <div class="kpi-label">Selected</div>
            <div class="kpi-value" id="stat-selected">0</div>
          </div>
        </div>

        <!-- Bulk bar -->
        <div class="as-bulk-bar" id="app-bulk-bar">
          <span class="as-bulk-count"><span id="app-bulk-count">0</span> selected</span>
          <button class="btn btn-success btn-sm" data-action="bulk-select">Select</button>
          <button class="btn btn-danger-quiet btn-sm" data-action="bulk-reject">Reject</button>
          <button class="btn btn-ghost btn-sm" data-action="bulk-clear">Clear</button>
        </div>

        <!-- Filters -->
        <div class="as-filters">
          <div class="as-filter-group">
            <label for="filter-status">Status</label>
            <select id="filter-status">
              <option value="">All in pipeline</option>
              <option value="RECEIVED">New</option>
              <option value="REVIEWING">Reviewing</option>
              <option value="SHORTLISTED">Selected</option>
            </select>
          </div>
          <div class="as-filter-group">
            <label for="filter-role">Role</label>
            <select id="filter-role">
              <option value="">All roles</option>
              <option value="Bartender">Bartender</option>
              <option value="Barista">Barista</option>
              <option value="Front of House">Front of House</option>
              <option value="Waiter">Waiter</option>
              <option value="Chef">Chef</option>
              <option value="Kitchen Porter">Kitchen Porter</option>
              <option value="Runner">Runner</option>
            </select>
          </div>
          <div class="as-filter-group">
            <label for="filter-search">Search</label>
            <input type="search" id="filter-search" placeholder="Name, email, phone…">
          </div>
          <div class="as-filter-group">
            <label for="filter-location">Near</label>
            <input type="search" id="filter-location" placeholder="Postcode or area, e.g. SW1A 1AA">
          </div>
          <div class="as-filter-actions">
            <button class="btn btn-ghost" data-action="clear-filters">Clear</button>
          </div>
        </div>

        <!-- Table -->
        <div class="as-table-wrap">
          <div class="as-table-toolbar">
            <div class="as-toolbar-left">
              <span id="app-count" class="text-muted fs-sm">Loading…</span>
            </div>
            <div class="as-toolbar-right">
              <a href="admin-staff" class="btn btn-ghost btn-sm">Hired staff <span class="badge badge-muted" id="staff-count">0</span></a>
              <button class="btn btn-ghost btn-sm" data-action="show-rejected-pile">Rejected <span class="badge badge-muted" id="rejected-pile-count">0</span></button>
              <button class="btn btn-primary btn-sm" data-action="open-add-candidate">+ Add candidate</button>
              <button class="btn btn-ghost btn-sm" data-action="export-csv">&darr; CSV</button>
            </div>
          </div>
          <div id="rejected-pile-banner" class="as-alert-panel" style="display:none;margin:0 0 12px">
            <div class="as-alert-header">Rejected pile</div>
            <div class="as-alert-item">
              <span class="as-alert-text text-muted">Rejected candidates are kept here and stay out of the pipeline.</span>
              <button class="btn btn-ghost btn-sm" data-action="show-pipeline">Back to pipeline</button>
            </div>
          </div>
          <table>
            <thead>
              <tr>
                <th class="checkbox-col"><input type="checkbox" id="app-select-all" title="Select all"></th>
                <th data-sort="fullName">Candidate <span class="sort-icon">&#8597;</span></th>
                <th>Roles</th>
                <th data-sort="postcode">Location <span class="sort-icon">&#8597;</span></th>
                <th data-sort="status">Status <span class="sort-icon">&#8597;</span></th>
                <th data-sort="createdAt">Applied <span class="sort-icon">&#8597;</span></th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="applications-body">
              <tr><td colspan="7" class="loading"><div class="as-skeleton" style="margin:auto;max-width:200px"></div></td></tr>
            </tbody>
          </table>
          <div class="as-pagination" id="app-pagination"></div>
        </div>
      </div>
    </div><!-- .as-content -->
  </div><!-- .as-main -->

  <script src="/js/admin-core.js"></script>
  <script src="/js/admin-nav.js"></script>
  <script src="/js/admin-applicant.js"></script>
  <script src="/pages/js/admin-pipeline.js"></script>
</body>
</html>
